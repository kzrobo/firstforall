# Hourly YouTube → LEARN sync. It only calls the site's protected endpoint; the YouTube API key
# stays in the site's server environment. Inactive until both repository secrets exist:
#   SITE_URL     e.g. https://firstforall.example (the deployed site)
#   CRON_SECRET  the same value as the site's CRON_SECRET environment variable
name: YouTube sync
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: youtube-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::YouTube sync is not configured yet (add the SITE_URL and CRON_SECRET repository secrets). Skipping."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/youtube-sync")
          cat response.json; echo
          if [ "$code" -ge 400 ]; then echo "::warning::YouTube sync returned HTTP $code"; exit 1; fi
